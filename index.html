<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="./script.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Calculator App</title>
</head>
<body>
    <header class="header">
        <h1 class="header h1">Calculator App</h1>
    </header>
    <div class="container main">
        <div class="calculator">
            <div class="display row">
                DISPLAY
            </div>
            <div class="first row">
                <button class="clear">Clear</button>
                <button class="operator">/</button>
            </div>
            <div class="second row">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">*</button>
            </div>
            <div class="third row">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">-</button>
            </div>
            <div class="fourth row">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">+</button>
            </div>
            <div class="fifth row">
                <button class="zero">0</button>
                <button class="decimal">.</button>
                <button class="operator">=</button>
            </div>
        </div>
    </div>
    <footer class="footer">
        <span>Made with love @flodardev</span>
    </footer>
</body>
</html>
